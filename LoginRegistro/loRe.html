<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endeudados - Iniciar Sesión / Registro</title>
  <link rel="stylesheet" href="loRe.css">
  <!-- SDK oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">

  <div class="modal-card auth-container">
    <a href="index.html" class="back-link">← Volver al inicio</a>
    
    <!-- Pestañas para cambiar entre Login y Registro -->
    <div class="modal-tabs">
      <button id="tab-login" class="tab-btn active">Iniciar Sesión</button>
      <button id="tab-registro" class="tab-btn">Registrarse</button>
    </div>

    <!-- Formulario de Iniciar Sesión -->
    <form id="form-login" class="auth-form">
      <div class="form-group">
        <label for="login-email">Correo Electrónico</label>
        <input type="email" id="login-email" placeholder="tu@correo.com" required>
      </div>

      <div class="form-group">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Entrar al Sistema</button>
      <p id="login-error" class="error-msg hidden"></p>
      <p id="login-info" class="info-msg hidden"></p>
    </form>

    <!-- Formulario de Registro (con Cédula) -->
    <form id="form-registro" class="auth-form hidden">
      <div class="form-group">
        <label for="reg-nombre">Nombre Completo</label>
        <input type="text" id="reg-nombre" placeholder="Ej. Cristian León" required>
      </div>

      <div class="form-group">
        <label for="reg-cedula">Número de Cédula</label>
        <input type="text" id="reg-cedula" placeholder="Ej. 1020304050" required>
      </div>

      <div class="form-group">
        <label for="reg-email">Correo Electrónico</label>
        <input type="email" id="reg-email" placeholder="tu@correo.com" required>
      </div>

      <div class="form-group">
        <label for="reg-password">Contraseña</label>
        <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Crear mi Cuenta</button>
      <p id="reg-error" class="error-msg hidden"></p>
      <p id="reg-success" class="success-msg hidden"></p>
    </form>
  </div>
  <script src="loRe.js"></script>
  <script src="auth.js"></script>
</body>
</html>
