<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endeudados - Recuperar Contraseña</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="recPass.css">
  <!-- SDK oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="auth-page">

  <div class="modal-card auth-container">
    <a href="../LoginRegistro/loRe.html" class="back-link">← Volver a iniciar sesión</a>

    <!-- Estado 1: pedir el correo -->
    <section id="paso-solicitar">
      <h1 class="rec-titulo">¿Olvidaste tu contraseña?</h1>
      <p class="rec-ayuda">
        Escribe el correo con el que te registraste y te enviamos un enlace para
        crear una nueva.
      </p>

      <form id="form-solicitar">
        <div class="form-group">
          <label for="rec-email">Correo Electrónico</label>
          <input type="email" id="rec-email" placeholder="tu@correo.com" required>
        </div>

        <button type="submit" id="btn-solicitar" class="btn btn-primary btn-full">
          Enviarme el enlace
        </button>

        <p id="solicitar-error" class="error-msg hidden"></p>
        <p id="solicitar-ok" class="success-msg hidden"></p>
      </form>
    </section>

    <!-- Estado 2: escribir la nueva contraseña (se llega desde el correo) -->
    <section id="paso-nueva" class="hidden">
      <h1 class="rec-titulo">Crea tu nueva contraseña</h1>
      <p class="rec-ayuda">Debe tener al menos 6 caracteres.</p>

      <form id="form-nueva">
        <div class="form-group">
          <label for="rec-password">Nueva contraseña</label>
          <input type="password" id="rec-password" placeholder="••••••••" minlength="6" required>
        </div>

        <div class="form-group">
          <label for="rec-password2">Confirma la contraseña</label>
          <input type="password" id="rec-password2" placeholder="••••••••" minlength="6" required>
        </div>

        <button type="submit" id="btn-nueva" class="btn btn-primary btn-full">
          Guardar contraseña
        </button>

        <p id="nueva-error" class="error-msg hidden"></p>
        <p id="nueva-ok" class="success-msg hidden"></p>
      </form>
    </section>

    <!-- Estado 3: el enlace no sirve (vencido o ya usado) -->
    <section id="paso-invalido" class="hidden">
      <h1 class="rec-titulo">Ese enlace ya no sirve</h1>
      <p class="rec-ayuda" id="invalido-detalle">
        Los enlaces de recuperación vencen. Pide uno nuevo y úsalo enseguida.
      </p>
      <button type="button" id="btn-reintentar" class="btn btn-primary btn-full">
        Pedir un enlace nuevo
      </button>
    </section>
  </div>

  <script src="../shared/supabase.js"></script>
  <script src="recPass.js"></script>
</body>

</html>
