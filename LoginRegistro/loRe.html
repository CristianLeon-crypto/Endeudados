<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endeudados - Iniciar Sesión / Registro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <!-- Avance de EN-29: los estilos comunes ya vienen de shared/base.css y
       loRe.css solo tiene lo exclusivo de esta pantalla (pestañas y enlace de
       recuperacion). No volver a copiar reglas comunes aca.
       Pendiente de EN-29: que auth.js use shared/supabase.js en vez de su
       propia URL y key (hoy chocarian las constantes si se cargan los dos). -->
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="loRe.css">
  <!-- SDK oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">

  <main class="seccion auth-layout">

    <!-- Marca (decorativa) -->
    <aside class="auth-marca">
      <a href="../index.html" class="logo">
        <svg class="logo-marca" viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="logo-degradado" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#1C1C1C" />
              <stop offset="1" stop-color="#28B660" />
            </linearGradient>
          </defs>
          <rect x="0.5" y="0.5" width="39" height="39" rx="11.5" fill="url(#logo-degradado)" stroke="#F3ECDE" stroke-opacity="0.18" />
          <rect x="9" y="11" width="22" height="4" rx="2" fill="#F3ECDE" />
          <rect x="9" y="18" width="15" height="4" rx="2" fill="#F3ECDE" />
          <rect x="9" y="25" width="8" height="4" rx="2" fill="#A9501C" />
        </svg>
        <span>Endeudados</span>
      </a>
      <h1 class="titulo-seccion">Tus finanzas, <span class="acento-serif">en claro</span>.</h1>
      <p class="texto-seccion">Registra lo que ganas y lo que gastas cada mes y descubre cuánto dinero tienes disponible de verdad.</p>
      <div class="auth-barras" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
    </aside>

    <div class="modal-card auth-container">
      <a href="../index.html" class="back-link">
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5" /><path d="m12 19-7-7 7-7" /></svg>
        Volver al inicio
      </a>

      <!-- Pestañas para cambiar entre Login y Registro -->
      <div class="modal-tabs">
        <button id="tab-login" class="tab-btn active">Iniciar Sesión</button>
        <button id="tab-registro" class="tab-btn">Registrarse</button>
      </div>

      <!-- Formulario de Iniciar Sesión -->
      <form id="form-login" class="auth-form">
        <div class="form-group">
          <label for="login-email">Correo Electrónico</label>
          <input type="email" id="login-email" placeholder="tu@correo.com" required>
        </div>

        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Entrar al Sistema</button>

        <p class="olvide-pass">
          <a href="../RecuperarPassword/recPass.html">¿Olvidaste tu contraseña?</a>
        </p>

        <p id="login-error" class="error-msg hidden"></p>
        <p id="login-info" class="info-msg hidden"></p>
      </form>

      <!-- Formulario de Registro (con Cédula) -->
      <form id="form-registro" class="auth-form hidden">
        <div class="form-group">
          <label for="reg-nombre">Nombre Completo</label>
          <input type="text" id="reg-nombre" placeholder="Ej. Cristian León" required>
        </div>

        <div class="form-group">
          <label for="reg-cedula">Número de Cédula</label>
          <input type="text" id="reg-cedula" placeholder="Ej. 1020304050" required>
        </div>

        <div class="form-group">
          <label for="reg-email">Correo Electrónico</label>
          <input type="email" id="reg-email" placeholder="tu@correo.com" required>
        </div>

        <div class="form-group">
          <label for="reg-password">Contraseña</label>
          <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Crear mi Cuenta</button>
        <p id="reg-error" class="error-msg hidden"></p>
        <p id="reg-success" class="success-msg hidden"></p>
      </form>
    </div>
  </main>

  <script src="loRe.js"></script>
  <script src="auth.js"></script>
</body>
</html>
